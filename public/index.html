<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yuto-tube v14.26.8.1.01</title>
    <style>
        /* 神秘的な黒と赤のテーマ */
        :root {
            --bg-color: #080000;
            --header-bg: #150505;
            --accent-color: #e50914;
            --text-color: #f5f5f5;
            --card-bg: #1c0a0a;
            --border-color: #4a0000;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        /* ログイン画面スタイル */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #2a0000 0%, #080000 100%);
        }
        .auth-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
        }
        .auth-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            -webkit-background-clip: text;
            color: transparent;
            animation: rainbow 5s linear infinite;
        }
        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #ccc;
        }
        /* 入力欄にヒントを表示させない完全隠蔽スタイル */
        .input-group input[type="text"],
        .input-group input[type="password"],
        .input-group input[type="email"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: #100000;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 5px;
            outline: none;
        }
        .checkbox-group {
            margin: 10px 0;
            font-size: 13px;
        }
        .checkbox-group label {
            cursor: pointer;
        }
        .auth-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background-color: #ff1e27;
        }
        .auth-links {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
        }
        .auth-links a {
            color: #ff6666;
            text-decoration: none;
            display: block;
            margin-top: 5px;
            cursor: pointer;
        }

        /* メインアプリ構造 */
        #app-wrapper {
            display: none; /* ログイン完了後に表示 */
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .menu-btn {
            font-size: 24px;
            cursor: pointer;
        }
        .logo {
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            -webkit-background-clip: text;
            color: transparent;
            animation: rainbow 5s linear infinite;
        }
        .search-container {
            display: flex;
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
        }
        .search-box {
            width: 100%;
            padding: 8px 15px;
            background-color: #100000;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 20px 0 0 20px;
            outline: none;
        }
        .search-btn {
            padding: 8px 18px;
            background-color: #2b0000;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
        }
        .time-display {
            font-size: 14px;
            color: #d1d1d1;
            font-family: monospace;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .logout-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
        }
        .error-msg {
            color: #ff4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<!-- 1. 認証画面（ログイン / 新規作成） -->
<div class="auth-container" id="authSection">
    <!-- ログインフォーム -->
    <div class="auth-box" id="loginForm">
        <div class="auth-title">yuto-tube</div>
        <div class="input-group">
            <label>アカウント名</label>
            <input type="text" id="loginUser" autocomplete="off">
        </div>
        <div class="input-group">
            <label>PIN</label>
            <input type="password" id="loginPin" autocomplete="off">
        </div>
        <div class="input-group">
            <label>パスワード</label>
            <input type="password" id="loginPass" autocomplete="off">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="chkAdmin" onchange="toggleAuthFields()"> あなたは管理者ですか?</label>
        </div>
        <div class="input-group" id="adminPassGroup" style="display: none;">
            <label>管理者パスワード</label>
            <input type="password" id="adminPass" autocomplete="off">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="chkDev" onchange="toggleAuthFields()"> あなたは開発者ですか?</label>
        </div>
        <div class="input-group" id="devPassGroup" style="display: none;">
            <label>開発者パスワード</label>
            <input type="password" id="devPass" autocomplete="off">
        </div>

        <button class="auth-btn" onclick="handleLogin()">ログイン</button>
        <div class="error-msg" id="loginError"></div>

        <div class="auth-links">
            <a onclick="alert('管理者または開発者にお問い合わせください')">パスワードを忘れた方はコチラ</a>
            <a onclick="switchAuthView('register')">アカウントを持っていませんか? 新規作成</a>
        </div>
    </div>

    <!-- 新規作成フォーム -->
    <div class="auth-box" id="registerForm" style="display: none;">
        <div class="auth-title">新規作成</div>
        <div class="input-group">
            <label>アカウント名</label>
            <input type="text" id="regUser" autocomplete="off" onblur="checkUserExists()">
            <div class="error-msg" id="userExistsError">他の人が使っているので、、、使用できません</div>
        </div>
        <div class="input-group">
            <label>メールアドレス (空欄可)</label>
            <input type="email" id="regEmail" autocomplete="off">
        </div>
        <div class="input-group">
            <label>PIN</label>
            <input type="password" id="regPin" autocomplete="off">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="regChkAdmin" onchange="toggleRegAuthFields()"> あなたは管理者ですか?</label>
        </div>
        <div class="input-group" id="regAdminPassGroup" style="display: none;">
            <label>管理者パスワード設定</label>
            <input type="password" id="regAdminPass" autocomplete="off">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="regChkDev" onchange="toggleRegAuthFields()"> あなたは開発者ですか?</label>
        </div>
        <div class="input-group" id="regDevPassGroup" style="display: none;">
            <label>開発者パスワード設定</label>
            <input type="password" id="regDevPass" autocomplete="off">
        </div>

        <button class="auth-btn" onclick="handleRegister()">アカウント作成</button>

        <div class="auth-links">
            <a onclick="switchAuthView('login')">既にアカウントをお持ちの方はコチラ</a>
        </div>
    </div>
</div>

<!-- 2. メインアプリ（ログイン後に表示） -->
<div id="app-wrapper">
    <header>
        <div class="header-left">
            <div class="menu-btn">≡</div>
            <a href="#" class="logo" id="logoBtn">yuto-tube v14.26.8.1.01</a>
        </div>
        <div class="search-container">
            <input type="text" class="search-box" placeholder="検索" id="searchInput">
            <button class="search-btn">検索</button>
        </div>
        <div class="user-info">
            <span id="displayUsername"></span>
            <span id="displayRole" style="color: #ff8888;"></span>
            <button class="logout-btn" onclick="handleLogout()">ログアウト</button>
            <div class="time-display" id="clock">--:-- --</div>
        </div>
    </header>

    <div style="padding: 20px;">
        <h2>ホーム</h2>
        <p>ログイン成功！コンテンツを準備中...</p>
    </div>
</div>

<script>
    // ダミーユーザーリスト (ローカルテスト用・重複確認)
    const existingUsers = ["admin", "yuto", "testuser"];

    // ページロード時の初期化（ローカルストレージ確認）
    window.onload = function() {
        updateClock();
        setInterval(updateClock, 1000);

        // ローカルストレージからログイン情報を復元
        const savedUser = localStorage.getItem('yuto_tube_user');
        if (savedUser) {
            const userData = JSON.parse(savedUser);
            showMainApp(userData);
        }
    };

    // 時計更新
    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        const ampm = hours >= 12 ? 'P.M' : 'A.M';
        hours = hours % 12;
        hours = hours ? hours : 12;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById('clock').textContent = hours + ':' + minutes + ' ' + ampm;
    }

    // 画面切り替え (ログイン <-> 新規作成)
    function switchAuthView(view) {
        if (view === 'register') {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        } else {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }
    }

    // ログイン時の多段階入力欄切り替え
    function toggleAuthFields() {
        const isAdmin = document.getElementById('chkAdmin').checked;
        const isDev = document.getElementById('chkDev').checked;

        document.getElementById('adminPassGroup').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('devPassGroup').style.display = isDev ? 'block' : 'none';
    }

    // 新規登録時の多段階入力欄切り替え
    function toggleRegAuthFields() {
        const isAdmin = document.getElementById('regChkAdmin').checked;
        const isDev = document.getElementById('regChkDev').checked;

        document.getElementById('regAdminPassGroup').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('regDevPassGroup').style.display = isDev ? 'block' : 'none';
    }

    // アカウント名重複チェック
    function checkUserExists() {
        const username = document.getElementById('regUser').value.trim();
        const errorElem = document.getElementById('userExistsError');
        if (existingUsers.includes(username.toLowerCase())) {
            errorElem.style.display = 'block';
        } else {
            errorElem.style.display = 'none';
        }
    }

    // ログイン実行
    function handleLogin() {
        const username = document.getElementById('loginUser').value.trim();
        const pin = document.getElementById('loginPin').value;
        const pass = document.getElementById('loginPass').value;
        const isAdmin = document.getElementById('chkAdmin').checked;
        const isDev = document.getElementById('chkDev').checked;

        if (!username || !pin || !pass) {
            showLoginError("アカウント名、PIN、パスワードを入力してください");
            return;
        }

        let role = "一般利用者";
        if (isDev) {
            role = "開発者";
        } else if (isAdmin) {
            role = "管理者";
        }

        const userData = { username, role };

        // ローカルストレージに保存（再読み込み対策）
        localStorage.setItem('yuto_tube_user', JSON.stringify(userData));

        showMainApp(userData);
    }

    // 新規登録実行
    function handleRegister() {
        const username = document.getElementById('regUser').value.trim();
        const pin = document.getElementById('regPin').value;
        const isUserExists = document.getElementById('userExistsError').style.display === 'block';

        if (!username || !pin) {
            alert("アカウント名とPINを入力してください");
            return;
        }
        if (isUserExists) {
            alert("他の人が使っているので、、、使用できません");
            return;
        }

        existingUsers.
