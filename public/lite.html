<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yuto-tube Lite</title>
    <style>
        :root {
            --bg-color: #080000;
            --header-bg: #150505;
            --accent-color: #e50914;
            --text-color: #f5f5f5;
            --card-bg: #1c0a0a;
            --border-color: #4a0000;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-weight: bold;
            font-size: 18px;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            -webkit-background-clip: text;
            color: transparent;
            text-decoration: none;
        }
        .search-container {
            display: flex;
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
        }
        .search-box {
            width: 100%;
            padding: 8px 15px;
            background-color: #100000;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 20px 0 0 20px;
            outline: none;
        }
        .search-btn {
            padding: 8px 18px;
            background-color: #2b0000;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
        }
        .container {
            padding: 20px;
        }
        .player-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        .player-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">yuto-tube Lite</a>
    <div class="search-container">
        <input type="text" class="search-box" placeholder="検索" id="liteSearch">
        <button class="search-btn">検索</button>
    </div>
</header>

<div class="container">
    <h2>yuto-tube Lite (軽量版)</h2>
    <div class="player-box">
        <iframe src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>
</div>

</body>
</html>
